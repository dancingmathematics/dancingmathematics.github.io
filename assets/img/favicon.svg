<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  <!-- grid: the GRiD mat, abstracted -->
  <g stroke="#1f4e6b" stroke-width="2" opacity=".35">
    <line x1="12" y1="24" x2="52" y2="24"/>
    <line x1="12" y1="40" x2="52" y2="40"/>
    <line x1="24" y1="12" x2="24" y2="52"/>
    <line x1="40" y1="12" x2="40" y2="52"/>
  </g>
  <!-- auxiliary line -->
  <line x1="14" y1="50" x2="50" y2="14" stroke="#e05142" stroke-width="4" stroke-linecap="round"/>
  <circle cx="24" cy="40" r="4.5" fill="#e05142"/>
</svg>
